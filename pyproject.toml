[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK)"
requires-python = ">=3.12"
dependencies = [
  "google-adk[db]==2.13.0",
  "python-dotenv>=1,<2",
]

[project.scripts]
aurora-api = "aurora.api.cli:main"
aurora-restaurar = "aurora.ciclo_de_vida.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["aceitacao: roteiro de aceitação contra a API real (exige AURORA_ACEITACAO=1)"]
addopts = "-m 'not aceitacao'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
